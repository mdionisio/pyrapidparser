[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrapidparser"
version = "0.1.0"
description = "Parser, AST tools and Python translator for the ABB RAPID language"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.9"
dependencies = [
    "ply>=3.11",
]

[project.optional-dependencies]
# robot models, kinematics and motion instructions (run/robotmodel.py, run/pyrapid_motion.py)
motion = [
    "pin>=3",
    "numpy",
    "xacro",
]
# real time 3D view of the robot in the browser
view = [
    "pyrapidparser[motion]",
    "meshcat",
]

[tool.hatch.build]
# the sources are flat top-level modules, so list them explicitly
[tool.hatch.build.targets.wheel]
include = [
    "/ast_gen.py",
    "/browse_rapid_ast.py",
    "/eio.py",
    "/plyparser.py",
    "/rapid2py.py",
    "/rapid2rapid.py",
    "/rapid_lexer.py",
    "/rapid_parser.py",
    "/rapidvalidate.py",
    "/models",
    "/run",
]

[tool.hatch.build.targets.sdist]
include = [
    "/*.py",
    "/_rapid_ast.cfg",
    "/README.md",
    "/todo.md",
    "/run",
    "/test",
    "/default",
]

# rapid_ast.py is generated from _rapid_ast.cfg (see hatch_build.py)
[tool.hatch.build.hooks.custom]

[tool.hatch.envs.default]
features = ["view"]
dependencies = [
    "pytest",
    "pytest-cov",
    "mypy>=1.9",
    "ruff",
    "hatchling",
]

[tool.hatch.envs.default.scripts]
gen-ast = "python _ast_gen.py"
test = ["gen-ast", "pytest {args}"]
cov = ["gen-ast", "pytest --cov --cov-report=term-missing {args}"]
typecheck = ["gen-ast", "mypy {args}"]
format = "ruff format {args}"
format-check = "ruff format --check --diff {args}"

# design of the parts of osj6 (examples/osj6/cad) and their view: not needed at run time.
#   hatch run cad:python examples/osj6/cad/parts.py        the parts (STEP, STL)
#   hatch run cad:python examples/osj6/cad/build_model.py  models/osj6.urdf from the parts
#   hatch run cad:viewer                                   the viewer in the browser
#   hatch run cad:python examples/osj6/cad/show.py ...     show parts in the viewer
[tool.hatch.envs.cad]
dependencies = [
    "cadquery",
    "numpy",
    "ocp_vscode",
    "ocp_viewer",
]

[tool.hatch.envs.cad.scripts]
viewer = "python -m ocp_viewer --port 3939"

[tool.hatch.envs.hatch-test]
dependencies = ["ply>=3.11"]

[tool.pytest.ini_options]
testpaths = ["test_rapid.py", "test_case_insensitive.py", "test_expressions.py", "test_strings.py", "test_roundtrip.py", "test_rapidvalidate.py", "test_robotmodel.py", "test_motion.py", "test_rapid2py.py", "test_public_programs.py", "test_quality.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
# generated files (rapid_ast.py from _rapid_ast.cfg, PLY tables)
extend-exclude = ["rapid_ast.py", "lextab.py", "yacctab.py", "parsetab.py", "third_party"]

[tool.mypy]
strict = true
files = [
    "_ast_gen.py",
    "ast_gen.py",
    "browse_rapid_ast.py",
    "eio.py",
    "hatch_build.py",
    "plyparser.py",
    "rapid2py.py",
    "rapid2rapid.py",
    "rapid_lexer.py",
    "rapid_parser.py",
    "rapidvalidate.py",
    "run",
    "test_quality.py",
    "test_case_insensitive.py",
    "test_expressions.py",
    "test_rapid.py",
    "test_strings.py",
    "test_roundtrip.py",
    "test_rapid2py.py",
    "test_public_programs.py",
    "test_rapidvalidate.py",
    "test_robotmodel.py",
    "test_motion.py",
    "test/server.py",
]
# rapid_ast.py is generated and untyped: its constructors may be called from typed code
untyped_calls_exclude = ["rapid_ast"]

[[tool.mypy.overrides]]
module = ["rapid_ast", "lextab", "yacctab", "parsetab"]
ignore_errors = true
# rapid_ast re-exports Node, NodeVisitor, ... from ast_gen
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["ply", "ply.*", "pinocchio", "pinocchio.*", "xacro", "meshcat", "meshcat.*", "ament_index_python.*"]
ignore_missing_imports = true
